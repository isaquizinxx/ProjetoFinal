<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Detalhes da Equipe - Fórmula 1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="img/f1logo.png" type="image/x-icon">
  <style>
    :root {
      --main-bg: linear-gradient(135deg, #222 60%, #111 100%);
      --main-color: #fff;
      --accent: #5be6ff;
      --danger: #ff5555;
      --navbar-bg: rgba(20,20,20,0.98);
      --card-bg: #181818e0;
      --shadow: 0 8px 32px #00000060;
      --radius: 18px;
      --transition: 0.3s;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Montserrat', Arial, sans-serif;
      background: var(--main-bg);
      color: var(--main-color);
      transition: background var(--transition), color var(--transition);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

        /* HEADER */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #181818e0;
      padding: 12px 24px;
      border-top: 4px solid var(--danger);
      border-bottom: 4px solid var(--danger);
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      font-size: 1.4em;
      color: var(--accent);
    }

    .logo img {
      height: 48px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    nav a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      margin: 0 5px;
      padding: 8px 12px;
      border-radius: 8px;
      transition: background var(--transition), color var(--transition), transform var(--transition);
    }

    nav a:hover {
      background: var(--danger);
      color: #fff;
      transform: scale(1.08);
    }

    /* BOTÃO HAMBÚRGUER */
    .menu-toggle {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 40px;
      height: 40px;
      cursor: pointer;
      border-radius: 8px;
      transition: background var(--transition);
    }

    .menu-toggle:hover { background: #333; }

    .menu-toggle div {
      width: 26px;
      height: 3px;
      background: var(--accent);
      margin: 4px 0;
      border-radius: 3px;
      transition: all var(--transition);
    }

    /* CONTEÚDO */
    main {
      flex: 1;
      padding: 40px 16px;
      animation: fadeIn 1s;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .team-profile {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 30px;
      max-width: 1000px;
      width: 100%;
      align-items: center;
    }

    .team-photo {
      flex: 1 1 350px;
      text-align: center;
    }

    .team-photo img {
      width: 100%;
      max-width: 350px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      object-fit: contain;
    }

    .team-info {
      flex: 2 1 500px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .team-info h2 {
      color: var(--accent);
      font-size: 2.2em;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .team-info .base {
      font-size: 1.3em;
      font-weight: bold;
      color: #ddd;
    }

    .team-info .bio {
      font-size: 1em;
      color: #ccc;
      line-height: 1.6em;
      margin-top: 8px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .stat-box {
      background: #111;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat-box h3 {
      color: var(--accent);
      margin: 0;
      font-size: 1em;
      font-weight: 700;
    }

    .stat-box p {
      font-size: 1.5em;
      font-weight: 900;
      margin: 4px 0 0;
    }

    .back-btn {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 18px;
      background: var(--danger);
      color: #fff;
      border-radius: var(--radius);
      font-weight: bold;
      text-decoration: none;
      transition: background var(--transition), transform var(--transition);
      text-align: center;
    }

    .back-btn:hover {
      background: var(--accent);
      color: #000;
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      padding: 16px;
      background: var(--navbar-bg);
      border-top: 4px solid var(--danger);
      color: var(--accent);
      box-shadow: var(--shadow);
      font-weight: 500;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============================= */
    /* RESPONSIVIDADE F1 PADRÃO */
    /* ============================= */
    @media (max-width: 900px) {
      .menu-toggle {
        display: flex;
      }

      nav {
        position: absolute;
        top: 80px;
        right: 0;
        background: #111;
        width: 100%;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 20px 0;
        border-top: 3px solid var(--danger);
        transform: translateY(-200%);
        opacity: 0;
        transition: all 0.4s ease;
      }

      nav.active {
        transform: translateY(0);
        opacity: 1;
      }

      nav a {
        display: block;
        width: 100%;
        text-align: center;
        padding: 12px;
      }

      .menu-toggle.active div:nth-child(1) {
        transform: rotate(45deg) translateY(8px);
      }

      .menu-toggle.active div:nth-child(2) {
        opacity: 0;
      }

      .menu-toggle.active div:nth-child(3) {
        transform: rotate(-45deg) translateY(-8px);
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="img/f1logo1-removebg-preview.png" alt="F1 Logo">
      <span>FÓRMULA 1</span>
    </div>
    <div class="menu-toggle" id="menu-toggle" aria-label="Abrir menu">
      <div></div><div></div><div></div>
    </div>
       <div>
      <nav id="nav">
        <a href="C:\Users\izaque.7944\Documents\front-end\f1-site\index.html">Início</a>
        <a href="noticias.html">Notícias</a>
        <a href="pilotos.html">Pilotos</a>
        <a href="equipes.html">Equipes</a>
        <a href="calendario.html">Calendário</a>
        <a href="podio.html">Pódio</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="details" class="team-profile"></section>
  </main>

  <footer>
    &copy; 2025 Fórmula 1 | Projeto inspirado no site oficial da F1
  </footer>

  <script>
    // MENU RESPONSIVO
    const toggle = document.getElementById('menu-toggle');
    const nav = document.getElementById('nav');
    toggle.addEventListener('click', () => {
      toggle.classList.toggle('active');
      nav.classList.toggle('active');
    });

    // LISTA COMPLETA DE EQUIPES
    const teams = [
      { name: 'McLaren', base: 'Woking, Reino Unido', championships: 8, wins: 184, podiums: 500, img: 'imagens equipes/mclaren.jpg', bio: 'Uma das equipes mais vitoriosas da história da F1.' },
      { name: 'Alpine', base: 'Enstone, Reino Unido', championships: 0, wins: 2, podiums: 25, img: 'imagens equipes/alpine.png', bio: 'Equipe focada em evolução e desenvolvimento de jovens talentos.' },
      { name: 'Red Bull Racing', base: 'Milton Keynes, Reino Unido', championships: 6, wins: 120, podiums: 250, img: 'imagens equipes/red-bull.webp', bio: 'Revolucionou a aerodinâmica moderna na Fórmula 1.' },
      { name: 'Mercedes', base: 'Brackley, Reino Unido', championships: 8, wins: 125, podiums: 300, img: 'imagens equipes/mercedes logo.png', bio: 'Dominou a era híbrida de 2014 a 2021 com supremacia técnica.' },
      { name: 'Aston Martin', base: 'Silverstone, Reino Unido', championships: 0, wins: 3, podiums: 30, img: 'imagens equipes/Aston-Martin-logo.avif', bio: 'Equipe com forte investimento e crescimento contínuo.' },
      { name: 'Ferrari', base: 'Maranello, Itália', championships: 16, wins: 243, podiums: 800, img: 'imagens equipes/ferrari-logo-illustration.jpg', bio: 'A equipe mais tradicional e icônica da Fórmula 1.' },
      { name: 'Williams', base: 'Grove, Reino Unido', championships: 7, wins: 114, podiums: 500, img: 'imagens equipes/williams.png', bio: 'Histórica equipe britânica com grande legado na F1.' },
      { name: 'Haas', base: 'Kannapolis, Estados Unidos', championships: 0, wins: 0, podiums: 6, img: 'imagens equipes/haas-logo.jpg', bio: 'Equipe americana focada em eficiência e desenvolvimento.' },
      { name: 'Sauber', base: 'Hinwil, Suíça', championships: 0, wins: 1, podiums: 20, img: 'imagens equipes/Kick-Sauber.jpg', bio: 'Equipe tradicional suíça, atualmente Kick Sauber.' },
      { name: 'Racing Bulls', base: 'Milton Keynes, Reino Unido', championships: 0, wins: 0, podiums: 0, img: 'imagens equipes/visa-cash-app-rb-logo.jpg', bio: 'Equipe nueva focada no desenvolvimento de jovens pilotos.' }
    ];

    // PEGAR EQUIPE PELO HASH
    const slug = window.location.hash.substring(1);
    function toSlug(name) {
      return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }

    const team = teams.find(t => toSlug(t.name) === slug);
    const details = document.getElementById('details');

    if (team) {
      details.innerHTML = `
        <div class="team-photo">
          <img src="${team.img}" alt="${team.name}" loading="lazy">
        </div>
        <div class="team-info">
          <h2>${team.name}</h2>
          <div class="base">📍 ${team.base}</div>
          <p class="bio">${team.bio}</p>
          <div class="stats">
            <div class="stat-box"><h3>Títulos</h3><p>${team.championships}</p></div>
            <div class="stat-box"><h3>Vitórias</h3><p>${team.wins}</p></div>
            <div class="stat-box"><h3>Pódios</h3><p>${team.podiums}</p></div>
          </div>
          <a href="equipes.html" class="back-btn">← Voltar às Equipes</a>
        </div>
      `;
    } else {
      details.innerHTML = `
        <div style="width:100%;text-align:center">
          <p>Equipe não encontrada.</p>
          <a href="equipes.html" class="back-btn">← Voltar</a>
        </div>
      `;
    }
  </script>
</body>
</html>
